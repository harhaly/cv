name: Build CV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build CV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build English CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv_en.tex
          latexmk_use_xelatex: true
          working_directory: src

      - name: Build Russian CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv_ru.tex
          latexmk_use_xelatex: true
          working_directory: src

      - name: Publish PDFs to docs
        run: |
          mkdir -p docs/en docs/ru
          cp src/cv_en.pdf docs/en/cv.pdf
          cp src/cv_ru.pdf docs/ru/cv.pdf

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/en/cv.pdf docs/ru/cv.pdf

          if git diff --cached --quiet; then
            echo "No PDF changes to commit"
          else
            git commit -m "Update CV PDFs"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write
      contents: read

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4