name: Build CV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build CV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependencies
        run: pip install -r requirements.txt

      - name: Generate LaTeX and HTML from one source
        run: python scripts/generate_cv.py

      - name: Build English PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv_en.tex
          latexmk_use_xelatex: true
          working_directory: src

      - name: Build Russian PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv_ru.tex
          latexmk_use_xelatex: true
          working_directory: src

      - name: Publish PDFs
        run: |
          mkdir -p docs/en docs/ru
          cp src/cv_en.pdf docs/en/cv.pdf
          cp src/cv_ru.pdf docs/ru/cv.pdf

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write
      contents: read

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
