    summary: 'QA-инженер с 5-летним опытом верификации ПЛИС. Строю тестовые окружения на Python, автоматизирую анализ результатов
      и нахожу причины несоответствий в сложных системах. Люблю работать с данными: сортирую и анализирую результаты прогонов,
      формирую отчёты и визуализирую их в графиках. Умею автоматизировать тестирование REST API и UI.'
    hire: Считаю тестирование своей профессией на долгую дистанцию и сознательно развиваюсь в этом направлении. Широкий технический
      бэкграунд позволяет быстро разбираться в архитектуре новых проектов и находить слабые места там, где их не видно на
      уровне спецификации. Внимательно отношусь к требованиям, беру ответственность за качество продукта, сам закрываю пробелы
      в знаниях и довожу задачи до результата.
    experience:
      company: КТЦ Электроника
      role: QA-инженер
      dates: Май 2021 – Настоящее время
      location: Россия, Воронеж
      bullets:
      - Покрыл тестами недокументированный legacy-блок ПЛИС, поведение которого никто в команде не знал, и зафиксировал его
        эталонное поведение. Это позволило переписать блок с нуля и верифицировать новую реализацию на полное соответствие
        оригиналу без регрессий.
      - Анализировал спецификации и требования к блокам ПЛИС, составлял тест-планы и тест-кейсы, применяя техники тест-дизайна
        (граничные значения, классы эквивалентности, комбинаторика режимов).
      - Проводил ручное и исследовательское тестирование новых блоков до автоматизации проверок.
      - Разработал тестовое окружение на Python для верификации Verilog-моделей ПЛИС: режимы работы, коммутация, основной
          функционал и отдельные блоки. Отделил инфраструктуру окружения от тестов, благодаря чему новые тесты добавляются
          без изменений во фреймворке.
      - Автоматизировал разбор логов симуляции bash-скриптами: парсинг, фильтрация и сводка результатов прогонов. Это сократило
          ручной анализ на ~75%.
      - Выявил и задокументировал 2000+ несоответствий модели спецификации до этапа синтеза. Оформлял баг-репорты в Jira,
        локализовал причины дефектов и сопровождал их до исправления.
    project:
      name: 'PARABANK: АВТОТЕСТЫ UI И REST API | PYTEST, SELENIUM'
