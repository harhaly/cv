<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nikolai Avtsinov — CV</title>
  <meta name="description" content="Nikolai Avtsinov — Manual / Automation QA Engineer. English CV.">
  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#e9e9e9; }
    .cv-frame { position:fixed; inset:0; width:100%; height:100%; border:0; display:block; background:#fff; }
    .language-switcher {
      position:fixed; z-index:2147483647; top:50%; right:18px; transform:translateY(-50%);
      display:flex; flex-direction:column; gap:4px; padding:5px;
      background:rgba(255,255,255,.97); border:1px solid #d7d7d7; border-radius:7px;
      box-shadow:0 4px 16px rgba(0,0,0,.18); font-family:"Segoe UI",Arial,sans-serif;
    }
    .language-switcher button {
      appearance:none; border:0; min-width:46px; padding:8px 9px; text-align:center;
      border-radius:4px; background:transparent; color:#555; cursor:pointer;
      font-size:12px; font-weight:700; line-height:1.2;
    }
    .language-switcher button.active { background:#2878D8; color:#fff; }
    .language-switcher button:hover:not(.active) { background:#f1f1f1; }
    @media (max-width:700px) {
      .language-switcher { right:8px; }
      .language-switcher button { min-width:42px; padding:7px 8px; }
    }
  </style>
</head>
<body>
  <iframe id="cv" class="cv-frame" src="en/cv.pdf#view=FitH" title="Nikolai Avtsinov English CV"></iframe>

  <nav class="language-switcher" aria-label="Language selection">
    <button id="en" class="active" type="button" onclick="setLanguage('en')">EN</button>
    <button id="ru" type="button" onclick="setLanguage('ru')">RU</button>
  </nav>

  <script>
    const cv = document.getElementById('cv');
    const buttons = { en: document.getElementById('en'), ru: document.getElementById('ru') };

    function setLanguage(lang, updateUrl = true) {
      const isRu = lang === 'ru';
      cv.src = (isRu ? 'ru/cv.pdf' : 'en/cv.pdf') + '#view=FitH';
      cv.title = isRu ? 'Николай Авцинов — русское резюме' : 'Nikolai Avtsinov English CV';
      document.documentElement.lang = isRu ? 'ru' : 'en';
      buttons.en.classList.toggle('active', !isRu);
      buttons.ru.classList.toggle('active', isRu);
      buttons.en.setAttribute('aria-pressed', String(!isRu));
      buttons.ru.setAttribute('aria-pressed', String(isRu));
      document.title = isRu ? 'Николай Авцинов — Резюме' : 'Nikolai Avtsinov — CV';
      if (updateUrl) history.replaceState(null, '', isRu ? '#ru' : '#en');
    }

    // English is always the default. A #ru link opens the same page in Russian.
    if (location.hash.toLowerCase() === '#ru') setLanguage('ru', false);
    else setLanguage('en', false);
  </script>
</body>
</html>
